<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | Oásis Car Estética</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #ffffff; }
        .pulse-red { animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <!-- CABEÇALHO -->
    <header class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center pb-6 border-b border-neutral-800 gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-red-600/20 flex items-center justify-center text-red-500 font-extrabold text-xl">
                O
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">OÁSIS CAR <span class="text-red-600">CENTRAL DE LEADS</span></h1>
                <p class="text-xs text-neutral-400">Atendimento e Orçamentos em Tempo Real</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="statusConexao" class="flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Monitorando ao Vivo
            </div>
            <button onclick="testarSom()" class="text-xs bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-3 py-1.5 rounded-lg border border-neutral-700 transition">
                <i class="fa-solid fa-volume-high mr-1"></i> Testar Alerta
            </button>
        </div>
    </header>

    <!-- METRICAS RÁPIDAS -->
    <main class="max-w-6xl mx-auto py-8">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-neutral-900/80 border border-neutral-800 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-xs text-neutral-400 font-medium">Urgentes / Não Atendidos</span>
                    <h2 id="totalNovos" class="text-3xl font-extrabold text-red-500 mt-1">0</h2>
                </div>
                <div class="w-12 h-12 rounded-xl bg-red-500/10 flex items-center justify-center text-red-500 text-xl">
                    <i class="fa-solid fa-bell"></i>
                </div>
            </div>

            <div class="bg-neutral-900/80 border border-neutral-800 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-xs text-neutral-400 font-medium">Atendidos Hoje</span>
                    <h2 id="totalAtendidos" class="text-3xl font-extrabold text-emerald-500 mt-1">0</h2>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-500 text-xl">
                    <i class="fa-solid fa-check-double"></i>
                </div>
            </div>

            <div class="bg-neutral-900/80 border border-neutral-800 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-xs text-neutral-400 font-medium">Total Solicitados</span>
                    <h2 id="totalGeral" class="text-3xl font-extrabold text-white mt-1">0</h2>
                </div>
                <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-car"></i>
                </div>
            </div>
        </div>

        <!-- LISTA DE LEADS -->
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-fire text-red-500"></i> Fila de Atendimento
            </h3>
            <span class="text-xs text-neutral-500">Atualização instantânea sem recarregar</span>
        </div>

        <div id="listaLeads" class="space-y-4">
            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-8 text-center text-neutral-500 text-sm">
                Carregando solicitação de orçamentos...
            </div>
        </div>
    </main>

    <script>
        // ATENÇÃO: COLE SUAS CHAVES DO SUPABASE AQUI
        const SUPABASE_URL = "SUA_URL_DO_SUPABASE_AQUI";
        const SUPABASE_KEY = "SUA_CHAVE_ANON_PUBLIC_AQUI";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let audioCtx = null;

        function tocarAlerta() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) { console.log(e); }
        }

        function testarSom() {
            tocarAlerta();
        }

        function calcularTempo(dataISO) {
            const minutos = Math.floor((new Date() - new Date(dataISO)) / 60000);
            if (minutos < 1) return "Agora mesmo 🔥";
            if (minutos === 1) return "Há 1 min ⏳";
            if (minutos < 60) return `Há ${minutos} mins ⏳`;
            const horas = Math.floor(minutos / 60);
            return `Há ${horas}h ⏳`;
        }

        async function carregarLeads() {
            const { data: leads, error } = await supabaseClient
                .from('orcamentos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            renderizarLeads(leads);
        }

        function renderizarLeads(leads) {
            const container = document.getElementById('listaLeads');
            let novos = 0;
            let atendidos = 0;

            if (!leads || leads.length === 0) {
                container.innerHTML = `<div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center text-neutral-500 text-sm">Nenhum orçamento solicitado ainda.</div>`;
                document.getElementById('totalNovos').innerText = '0';
                document.getElementById('totalAtendidos').innerText = '0';
                document.getElementById('totalGeral').innerText = '0';
                return;
            }

            container.innerHTML = '';

            leads.forEach(lead => {
                if (lead.status === 'Novo') novos++;
                if (lead.status === 'Atendido') atendidos++;

                const ehNovo = lead.status === 'Novo';
                const tempoExtenso = calcularTempo(lead.created_at);

                const card = document.createElement('div');
                card.className = `bg-neutral-900 border ${ehNovo ? 'border-red-600/80 pulse-red' : 'border-neutral-800 opacity-75'} rounded-2xl p-5 sm:p-6 transition-all flex flex-col md:flex-row justify-between items-start md:items-center gap-4`;

                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-lg text-white">${lead.nome}</span>
                            ${ehNovo 
                                ? `<span class="bg-red-600/20 text-red-500 border border-red-600/50 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">RESPOSTA URGENTE</span>`
                                : `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 text-[10px] font-semibold px-2.5 py-0.5 rounded-full">Atendido</span>`
                            }
                            <span class="text-xs text-neutral-400"><i class="fa-regular fa-clock mr-1"></i>${tempoExtenso}</span>
                        </div>
                        <div class="text-sm text-neutral-300 flex flex-wrap gap-x-4 gap-y-1 pt-1">
                            <span><strong class="text-neutral-500">Veículo:</strong> ${lead.veiculo}</span>
                            <span><strong class="text-neutral-500">Serviço:</strong> <span class="text-red-400 font-semibold">${lead.servico}</span></span>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 w-full md:w-auto">
                        ${ehNovo ? `
                            <button onclick="marcarAtendido(${lead.id})" class="flex-1 md:flex-none text-xs bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-semibold px-4 py-3 rounded-xl border border-neutral-700 transition">
                                <i class="fa-solid fa-check mr-1"></i> Marcar Concluído
                            </button>
                        ` : ''}
                        <button onclick="responderCliente('${lead.nome}', '${lead.servico}')" class="flex-1 md:flex-none text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-3 rounded-xl shadow-lg shadow-emerald-900/20 transition flex items-center justify-center gap-2">
                            <i class="fa-brands fa-whatsapp text-base"></i> Conversar Agora
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });

            document.getElementById('totalNovos').innerText = novos;
            document.getElementById('totalAtendidos').innerText = atendidos;
            document.getElementById('totalGeral').innerText = leads.length;
        }

        async function marcarAtendido(id) {
            await supabaseClient.from('orcamentos').update({ status: 'Atendido' }).eq('id', id);
            carregarLeads();
        }

        function responderCliente(nome, servico) {
            const texto = `Olá ${nome}, tudo bem? Sou da Oásis Car Estética. Vi que você solicitou um orçamento para o serviço de ${servico}. Como posso te ajudar hoje?`;
            window.open(`https://wa.me/5516991408438?text=${encodeURIComponent(texto)}`, '_blank');
        }

        supabaseClient
            .channel('orcamentos-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orcamentos' }, payload => {
                tocarAlerta();
                carregarLeads();
            })
            .subscribe();

        carregarLeads();
    </script>
</body>
</html>
