<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Oásis Car Estética</title>
    <!-- Supabase e Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; }
        .view-section { display: none; }
        .active-view { display: block; }
    </style>
</head>
<body class="p-6">

    <!-- CABEÇALHO -->
    <header class="mb-8">
        <h1 id="page-title" class="text-2xl font-bold text-amber-500">Leads & CRM</h1>
        <p id="page-subtitle" class="text-sm text-gray-400">Gerenciamento de orçamentos e atendimentos</p>
    </header>

    <!-- TABELA DE LEADS (CONECTADA AO SUPABASE) -->
    <div id="view-leads" class="view-section active-view bg-[#141414] border border-[#262626] rounded-2xl p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold">Orçamentos Recebidos</h2>
            <button onclick="carregarLeads()" class="bg-amber-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-amber-500">
                <i class="fa-solid fa-rotate mr-2"></i>Atualizar
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-xs text-gray-500 uppercase border-b border-[#262626]">
                        <th class="pb-3">Cliente</th>
                        <th class="pb-3">Veículo</th>
                        <th class="pb-3">Serviço</th>
                        <th class="pb-3">Status</th>
                        <th class="pb-3 text-right">Ação</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody" class="divide-y divide-[#262626]">
                    <!-- O JavaScript vai injetar os dados aqui -->
                    <tr><td colspan="5" class="py-10 text-center text-gray-500">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://pyodkkcmuoqrsnnifdqf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9jxs8Rc9L6BDNTvpT8fQ_A_dQSjuSHd';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const meuNumeroWhatsApp = '5516991408438';

        // FUNÇÃO PARA BUSCAR DADOS
        async function carregarLeads() {
            const tbody = document.getElementById('leadsTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-gray-500">Carregando...</td></tr>';

            try {
                // BUSCANDO NA TABELA 'orcamentos'
                const { data, error } = await supabaseClient
                    .from('orcamentos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-gray-500">Nenhum orçamento encontrado.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(item => {
                    const nome = item.nome || 'Cliente';
                    const veiculo = item.veiculo || 'N/I';
                    const servico = item.servico || 'N/I';
                    const status = item.status || 'NOVO';
                    
                    // Link do WhatsApp
                    const textoZap = `Olá ${nome}, vi seu pedido de orçamento para o serviço de ${servico} no veículo ${veiculo}. Vamos conversar?`;
                    const linkZap = `https://api.whatsapp.com/send?phone=${meuNumeroWhatsApp}&text=${encodeURIComponent(textoZap)}`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-4 font-medium">${nome}</td>
                        <td class="py-4 text-gray-400">${veiculo}</td>
                        <td class="py-4 text-gray-400">${servico}</td>
                        <td class="py-4"><span class="px-3 py-1 bg-amber-900/30 text-amber-500 rounded-full text-xs font-bold border border-amber-500/20">${status}</span></td>
                        <td class="py-4 text-right">
                            <a href="${linkZap}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg text-xs font-bold">
                                <i class="fa-brands fa-whatsapp mr-1"></i> Contato
                            </a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("Erro ao carregar:", err);
                tbody.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-red-500">Erro ao conectar ao banco.</td></tr>';
            }
        }

        // INICIALIZAÇÃO
        window.addEventListener('DOMContentLoaded', carregarLeads);
    </script>
</body>
</html>
