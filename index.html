<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oásis Car | CRM Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        .sidebar-gradient { background: linear-gradient(180deg, #141414 0%, #0a0a0a 100%); }
        .card-glass { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(10px); border: 1px solid #262626; }
    </style>
</head>
<body class="flex h-screen">

    <!-- MENU LATERAL -->
    <nav class="sidebar-gradient w-64 border-r border-neutral-800 p-6 flex flex-col">
        <div class="mb-10 text-amber-500 font-extrabold text-2xl tracking-tighter">
            OÁSIS CAR <span class="text-white text-xs block font-light tracking-widest">CRM PREMIUM</span>
        </div>
        
        <div class="space-y-2 flex-1">
            <button class="w-full text-left p-3 rounded-xl bg-neutral-900 border border-neutral-800 text-amber-500 font-bold transition-all">
                <i class="fa-solid fa-users mr-3"></i> Leads & Orçamentos
            </button>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold">Gestão de Orçamentos</h1>
                <p class="text-neutral-500">Acompanhamento de leads em tempo real.</p>
            </div>
            <button onclick="carregarLeads()" class="bg-amber-500 text-black px-6 py-2 rounded-full font-bold hover:bg-amber-400 transition-all">
                <i class="fa-solid fa-sync mr-2"></i> Atualizar Dados
            </button>
        </header>

        <!-- TABELA DE CRM -->
        <div class="card-glass rounded-3xl p-6">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-neutral-500 uppercase text-xs tracking-widest border-b border-neutral-800">
                        <th class="pb-4">Data / Hora</th>
                        <th class="pb-4">Cliente</th>
                        <th class="pb-4">Veículo</th>
                        <th class="pb-4">Serviço</th>
                        <th class="pb-4">Status</th>
                        <th class="pb-4 text-right">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaLeads" class="divide-y divide-neutral-800">
                    <!-- Dinâmico -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://pyodkkcmuoqrsnnifdqf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9jxs8Rc9L6BDNTvpT8fQ_A_dQSjuSHd';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const meuNumeroWhatsApp = '5516991408438';

        // FUNÇÃO PARA DELETAR O LEAD
        async function deletarLead(id) {
            if (!confirm('Tem certeza que deseja excluir este lead permanentemente?')) return;
            
            const { error } = await supabaseClient
                .from('pistas')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Erro ao excluir: ' + error.message);
            } else {
                carregarLeads(); // Atualiza a tabela na hora
            }
        }

        async function carregarLeads() {
            const tbody = document.getElementById('tabelaLeads');
            tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-center text-neutral-500">Carregando CRM...</td></tr>';

            const { data, error } = await supabaseClient
                .from('pistas')
                .select('*')
                .order('criado_em', { ascending: false });

            if (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-center text-red-500">Erro: ' + error.message + '</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            
            data.forEach(item => {
                const tr = document.createElement('tr');
                
                let dataFormatada = '-';
                if (item.criado_em) {
                    const dataObj = new Date(item.criado_em);
                    dataFormatada = dataObj.toLocaleString('pt-BR', {
                        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                    });
                }

                const linkZap = `https://wa.me/${meuNumeroWhatsApp}?text=${encodeURIComponent(`Olá ${item.nome}, vi seu interesse no serviço de ${item.servico}...`)}`;
                
                tr.innerHTML = `
                    <td class="py-5 text-neutral-400 text-sm">${dataFormatada}</td>
                    <td class="py-5 font-medium">${item.nome}</td>
                    <td class="py-5 text-neutral-400">${item.veiculo}</td>
                    <td class="py-5 text-neutral-400">${item.servico}</td>
                    <td class="py-5"><span class="bg-neutral-800 px-3 py-1 rounded-full text-xs">${item.status || 'NOVO'}</span></td>
                    <td class="py-5 text-right space-x-4">
                        <a href="${linkZap}" target="_blank" class="text-amber-500 hover:text-amber-300 font-bold" title="Chamar no WhatsApp">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </a>
                        <button onclick="deletarLead(${item.id})" class="text-neutral-500 hover:text-red-500 font-bold transition-all" title="Excluir Lead">
                            <i class="fa-solid fa-trash text-lg"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = carregarLeads;
    </script>
</body>
</html>
